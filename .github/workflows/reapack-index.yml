name: Build ReaPack index

on:
  push:
    branches: [main]
    paths-ignore:
      - index.xml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply pending release preparation
        run: |
          if [ -f tools/hotfix_0271.py ]; then
            python3 tools/hotfix_0271.py
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install ReaPack indexer
        run: gem install reapack-index

      - name: Build and validate index
        run: reapack-index --rebuild --no-commit .

      - name: Publish updated index and release preparation
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Release DrumCloud JS v0.27.1 self-contained ReaKit hotfix"
            git push
          fi
