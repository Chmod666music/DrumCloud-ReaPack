name: Build ReaPack index

on:
  push:
    branches: [main]
    paths-ignore:
      - index.xml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install ReaPack indexer
        run: gem install reapack-index

      - name: Build and validate index
        run: reapack-index --rebuild --no-commit .

      - name: Publish updated index
        run: |
          if [ -n "$(git status --porcelain index.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.xml
            git commit -m "Update ReaPack index"
            git push
          fi
