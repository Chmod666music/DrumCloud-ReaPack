name: Retry DrumCloud v0.27.2 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-0272.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install ReaPack indexer
        run: gem install reapack-index

      - name: Sync to latest main after concurrent index build
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Prepare v0.27.2 metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Effects/DrumCloud/DrumCloud_JS.jsfx'); s=p.read_text()
          assert s.count('version: 0.27.1\n') == 1
          s=s.replace('version: 0.27.1\n','version: 0.27.2\n',1)
          s=s.replace('changelog:\n','changelog:\n  Pin the bundled ReaKit GUI controls to the exact upstream 1.3.0 sources used to develop the v0.27 interface.\n',1)
          assert s.count('version = 0.271;') == 1
          s=s.replace('version = 0.271;','version = 0.272;',1)
          assert s.count('v0.27.1  /  REAKIT GUI') == 1
          s=s.replace('v0.27.1  /  REAKIT GUI','v0.27.2  /  REAKIT GUI',1)
          p.write_text(s)

          p=Path('README.md'); s=p.read_text()
          s=s.replace('# DrumCloud JS v0.27.1\n','# DrumCloud JS v0.27.2\n',1)
          s=s.replace('v0.27.1 keeps the complete dark-and-gold ReaKit interface','v0.27.2 keeps the complete dark-and-gold ReaKit interface',1)
          s=s.replace('## v0.26 tuning retained in v0.27.1','## v0.26 tuning retained in v0.27.2',1)
          marker='The required ReaKit GUI controls are now bundled with DrumCloud, so there is no\nseparate ReaKit dependency to install.'
          assert marker in s
          s=s.replace(marker,marker+'\nThe bundled knob/button libraries are pinned byte-for-byte to upstream ReaKit 1.3.0.',1)
          p.write_text(s)

          p=Path('CHANGELOG.md'); s=p.read_text()
          assert s.startswith('# Changelog\n\n')
          entry='# Changelog\n\n## 0.27.2\n- Pin the bundled ReaKit knob and button libraries byte-for-byte to upstream ReaKit 1.3.0.\n- Keep DrumCloud fully self-contained: no separate ReaKit installation is required.\n- Preserve the v0.27 GUI, all 34 sliders, presets, automation and v0.26 audio engine unchanged.\n\n'
          p.write_text(entry+s[len('# Changelog\n\n'):])

          p=Path('GUI_DEVELOPMENT.md'); s=p.read_text()
          s=s.replace('# DrumCloud v0.27.1 ReaKit GUI','# DrumCloud v0.27.2 ReaKit GUI',1)
          s=s.replace('`v0.27.1 / REAKIT GUI`','`v0.27.2 / REAKIT GUI`',1)
          p.write_text(s)
          PY

      - name: Commit release and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/retry-0272.yml .github/workflows/finalize-0272.yml
          git add Effects/DrumCloud/DrumCloud_JS.jsfx README.md CHANGELOG.md GUI_DEVELOPMENT.md
          git commit -m "Release DrumCloud JS v0.27.2 pinned ReaKit hotfix"

      - name: Build v0.27.2 ReaPack index
        run: |
          reapack-index --rebuild --no-commit .
          git add index.xml
          git commit -m "Update ReaPack index for v0.27.2"

      - name: Push release
        run: git push origin main
